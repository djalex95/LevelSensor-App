name: Build & Release APK + AAB

# Release wird durch einen Versions-Tag ausgelöst (z. B. v1.3.4).
# Push auf main baut KEIN Release mehr.
# Tag muss zur version: in pubspec.yaml passen.
#
# Für das release-signierte AAB (Play Store) müssen diese Repo-Secrets gesetzt sein:
#   KEYSTORE_BASE64    - der Upload-Keystore (.jks) als base64
#   KEYSTORE_PASSWORD  - Keystore-Passwort
#   KEY_PASSWORD       - Key-Passwort
#   KEY_ALIAS          - Alias (z. B. upload)
# Fehlen sie, wird debug-signiert gebaut (APK bleibt nutzbar, AAB nicht Play-tauglich).
#
# Es werden zwei Varianten gebaut:
#   APK (Flavor github) - mit In-App-Updater aus den GitHub-Releases
#   AAB (Flavor play)   - ohne In-App-Updater, fuer den Play Store

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version ermitteln
        id: ver
        run: |
          v=$(grep -oP '^version:\s*\K[^+\s]+' pubspec.yaml | head -n1)
          echo "app=$v" >> "$GITHUB_OUTPUT"
          echo "App-Version: $v"

      - name: Tag == pubspec.yaml prüfen
        if: github.ref_type == 'tag'
        run: |
          # Zwischen zwei Releases traegt die Version in pubspec.yaml ein
          # -dev-Suffix. Wer das vor dem Tag vergisst, soll es hier lesen
          # und nicht aus einem Vergleich zweier Nummern schliessen muessen.
          case "${{ steps.ver.outputs.app }}" in
            *-*) echo "::error::Version ${{ steps.ver.outputs.app }} in pubspec.yaml traegt noch ein Suffix. Vor dem Tag die reine Release-Nummer eintragen."; exit 1;;
          esac
          test "${GITHUB_REF_NAME#v}" = "${{ steps.ver.outputs.app }}" \
            || { echo "::error::Tag ${GITHUB_REF_NAME} passt nicht zu version ${{ steps.ver.outputs.app }} in pubspec.yaml"; exit 1; }

      - name: Release-Keystore einrichten
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/upload.jks"
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=$GITHUB_WORKSPACE/upload.jks
          EOF

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: APK + AAB bauen
        run: |
          flutter pub get
          # APK fuer GitHub: mit In-App-Updater
          flutter build apk --release --flavor github --dart-define=APP_CHANNEL=github
          # AAB fuer Play: ohne In-App-Updater (Play verbietet Selbst-Updates)
          flutter build appbundle --release --flavor play --dart-define=APP_CHANNEL=play

      - name: Artefakte mit Version benennen
        run: |
          mkdir -p dist
          # Je Artefakttyp wird nur ein Flavor gebaut, der Fund ist eindeutig.
          apk=$(find build/app/outputs -name '*.apk' | sort | head -n1 || true)
          aab=$(find build/app/outputs -name '*.aab' | sort | head -n1 || true)
          test -n "$apk" || { echo "::error::Keine APK gefunden"; exit 1; }
          test -n "$aab" || { echo "::error::Kein AAB gefunden"; exit 1; }
          cp "$apk" "dist/Fuellstandsensor-v${{ steps.ver.outputs.app }}-release.apk"
          cp "$aab" "dist/Fuellstandsensor-v${{ steps.ver.outputs.app }}.aab"

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.app }}
          name: App v${{ steps.ver.outputs.app }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.apk
            dist/*.aab
